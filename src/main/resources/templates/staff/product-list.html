<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-layout}">
<head>
    <title>Quản Lý Sản Phẩm</title>
</head>
<body>
<div layout:fragment="admin-content">
    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="page-title">
            Quản Lý Sản Phẩm
        </h4>
        <a th:href="@{${productBasePath + '/create'}}" class="btn btn-pet-primary">
            <i class="bi bi-plus-lg me-1"></i>Thêm Sản Phẩm
        </a>
    </div>

    <!-- Filter Bar -->
    <div class="card border-0 shadow-sm rounded-4 mb-4">
        <div class="card-body p-3">
            <form method="get" th:action="@{${productBasePath}}" class="row g-2 align-items-center">
                <div class="col-md-5">
                    <input type="text" name="keyword" class="form-control"
                           placeholder="Tìm theo tên sản phẩm..." th:value="${keyword}">
                </div>
                <div class="col-md-4">
                    <select name="categoryId" class="form-select">
                        <option value="">Tất cả danh mục</option>
                        <option th:each="category : ${categories}" th:value="${category.id}"
                                th:text="${category.name}"
                                th:selected="${selectedCategoryId != null and selectedCategoryId == category.id}">
                        </option>
                    </select>
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-pet-outline w-100">
                        <i class="bi bi-search me-1"></i> Tìm
                    </button>
                    <a th:href="@{${productBasePath}}" class="btn btn-outline-secondary text-nowrap">Xóa lọc</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Product Table -->
    <div class="card border-0 shadow-sm rounded-4 p-3">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th class="text-center" style="width: 60px;">Ảnh</th>
                    <th class="text-center">ID</th>
                    <th>Tên sản phẩm</th>
                    <th>Danh mục</th>
                    <th class="text-center">Thú cưng</th>
                    <th class="text-center">Trạng thái</th>
                    <th class="text-center">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${products.content}">
                    <!-- Display Product Image -->
                    <td class="align-middle" style="width: 60px;">
                        <!-- Display primary image. If no image data, show placeholder icon -->
                        <img th:if="${p.images != null and p.images.size() > 0}"
                             th:src="@{${p.images[0].imageUrl}}"
                             class="rounded border fade-in"
                             style="width: 45px; height: 45px; object-fit: cover;"
                             alt="Product Image"
                             onerror="this.style.display='none';">

                        <!-- Placeholder icon for products with NO image data in DB -->
                        <span th:if="${p.images == null or p.images.size() == 0}"
                              class="text-muted fs-5 d-flex justify-content-center align-items-center w-100 h-100">
                            <i class="bi bi-image"></i>
                        </span>
                    </td>

                    <td class="text-center" th:text="${p.id}">1</td>
                    <td>
                        <div class="fw-semibold" th:text="${p.name}">Tên SP</div>
                        <div class="small text-muted" th:text="${p.slug}">slug</div>
                    </td>
                    <td th:text="${p.category != null ? p.category.name : '-'}">Danh mục</td>

                    <!-- Pet Type Badges -->
                    <td class="text-center">
                        <span th:if="${p.petType.name() == 'DOG'}"
                              class="badge bg-primary-subtle text-primary-emphasis">
                            DOG
                        </span>
                        <span th:if="${p.petType.name() == 'CAT'}"
                              class="badge bg-danger-subtle text-danger-emphasis">
                            CAT
                        </span>
                        <span th:if="${p.petType.name() == 'BOTH'}"
                              class="badge bg-secondary-subtle text-secondary-emphasis">
                            BOTH
                        </span>
                    </td>

                    <!-- Status Badges -->
                    <td class="text-center">
                        <span th:if="${p.status.name() == 'ACTIVE'}"
                              class="badge status-badge bg-success">
                            Đang bán
                        </span>
                        <span th:if="${p.status.name() == 'HIDDEN'}"
                              class="badge status-badge bg-warning">
                            Tạm ẩn
                        </span>
                        <span th:if="${p.status.name() == 'DISCONTINUED'}"
                              class="badge status-badge bg-secondary">
                            Ngừng bán
                        </span>
                    </td>

                    <!-- Actions -->
                    <td class="text-center">
                        <a th:href="@{${productBasePath + '/{id}/edit'}(id=${p.id})}" class="btn btn-sm btn-outline-secondary">
                            <i class="bi bi-pencil"></i> Sửa
                        </a>
                        <a th:href="@{/staff/products/{id}/variants(id=${p.id})}" class="btn btn-sm btn-pet-outline ms-1">
                            <i class="bi bi-upc-scan"></i> SKU
                        </a>
                    </td>
                </tr>
                <tr th:if="${products == null or products.empty}">
                    <td colspan="7" class="text-center py-4 text-muted">
                        Không tìm thấy sản phẩm nào.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Pagination -->
    <div th:replace="~{fragments/pagination :: pagination(
        page=${products},
        url=@{${productBasePath}(keyword=${keyword}, categoryId=${selectedCategoryId})},
        itemName='sản phẩm')}">
    </div>
</div>
</body>
</html>
