<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-layout}">
<head>
    <title>Quản Lý Biến Thể SKU</title>
</head>
<body>
<div layout:fragment="admin-content">
    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="page-title">
                Quản Lý Biến Thể SKU
            </h4>
            <p class="mb-0">
                <span class="text-muted">Sản phẩm:</span>
                <span class="fw-bold fs-5 text-pet-primary" th:text="${product.name}">Tên SP</span>
            </p>
        </div>
        <div>
            <!-- Navigate to create form -->
            <a th:href="@{/staff/products/{id}/variants/create(id=${product.id})}" class="btn btn-pet-primary">
                <i class="bi bi-plus-lg me-1"></i>Thêm Biến Thể
            </a>
            <a th:href="@{/staff/products}" class="btn btn-outline-secondary ms-2">
                <i class="bi bi-arrow-left me-1"></i>Quay lại</a>
        </div>
    </div>

    <!-- SKU List Table -->
    <div class="card border-0 shadow-sm rounded-4 p-3">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>Mã SKU</th>
                    <th>Tên biến thể</th>
                    <th>Giá bán</th>
                    <th class="text-center">Tồn kho</th>
                    <th class="text-center">Trạng thái</th>
                    <th class="text-center">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <!-- Loop through variants -->
                <tr th:each="v : ${product.variants}">
                    <td class="fw-semibold" th:text="${v.skuCode}">SKU-001</td>
                    <td th:text="${v.variantName}">Túi 500g</td>
                    <td th:text="${#numbers.formatDecimal(v.price, 0, 'COMMA', 0, 'POINT') + ' đ'}">100.000 đ</td>
                    <td class="text-center">
                        <!-- In Stock: Quantity > Low Stock Threshold -->
                        <span th:if="${v.stockQuantity > v.lowStockThreshold}"
                              class="badge bg-success-subtle text-success-emphasis fs-6"
                              th:text="${v.stockQuantity}">10</span>

                        <!-- Low Stock: Quantity <= Threshold and > 0 -->
                        <span th:if="${v.stockQuantity > 0 and v.stockQuantity <= v.lowStockThreshold}"
                              class="badge bg-warning-subtle text-warning-emphasis fs-6"
                              th:text="${v.stockQuantity}">2</span>

                        <!-- Out of Stock: Quantity == 0 -->
                        <span th:if="${v.stockQuantity == 0}"
                              class="badge bg-danger-subtle text-danger-emphasis fs-6"
                              th:text="${v.stockQuantity}">0</span>
                    </td>
                    <td class="text-center">
                        <!-- Variant Status Badges -->
                        <span th:if="${v.status.name() == 'ACTIVE'}"
                              class="badge status-badge bg-success">
                            Đang bán
                        </span>
                        <span th:if="${v.status.name() == 'INACTIVE'}"
                              class="badge status-badge bg-warning">
                            Tạm ngưng
                        </span>
                        <span th:if="${v.status.name() == 'DISCONTINUED'}"
                              class="badge status-badge bg-secondary">
                            Ngừng bán
                        </span>
                    </td>
                    <td class="text-center">
                        <!-- Navigate to edit form -->
                        <a th:href="@{/staff/products/{id}/variants/{vid}/edit(id=${product.id}, vid=${v.id})}" class="btn btn-sm btn-outline-secondary">
                            <i class="bi bi-pencil"></i> Sửa
                        </a>
                    </td>
                </tr>
                <!-- Empty state -->
                <tr th:if="${#lists.isEmpty(product.variants)}">
                    <td colspan="6" class="text-center text-muted py-4">Chưa có biến thể nào.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
