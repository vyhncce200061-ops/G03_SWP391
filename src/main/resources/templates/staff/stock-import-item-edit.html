<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-layout}">
<head>
    <title>Sửa Mặt Hàng Nhập</title>
</head>
<body>
<div layout:fragment="admin-content">
    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="page-title">Sửa Mặt Hàng Nhập Kho</h4>
        <a th:href="@{/staff/stock-imports/{id}(id=${editForm.importId})}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>Quay lại chi tiết phiếu
        </a>
    </div>

    <!-- Error Message -->
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Centered Card Layout -->
    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-7">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-md-5">

                    <form th:action="@{/staff/stock-imports/items/{itemId}/edit(itemId=${editForm.itemId})}"
                          th:object="${editForm}" method="post">

                        <input type="hidden" th:field="*{importId}">

                        <!-- Product Info Summary (No Icons, Clean Text) -->
                        <div class="mb-4 p-3 bg-light rounded border">
                            <h6 class="fw-bold mb-1" th:text="${item.variant.product.name}">Tên sản phẩm</h6>
                            <div class="text-muted small">
                                Mã SKU: <span th:text="${item.variant.skuCode}">SKU-001</span>
                                <span class="mx-2">|</span>
                                Phân loại: <span th:text="${item.variant.variantName}">Túi 500g</span>
                            </div>
                        </div>

                        <!-- Form Inputs (No Icons) -->
                        <div class="row g-4 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Số lượng nhập <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" th:field="*{quantity}" min="1" required>
                                <small class="text-muted mt-1 d-block" th:text="'Tồn kho hiện tại: ' + ${item.variant.stockQuantity}">Tồn kho hiện tại: 10</small>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Đơn giá nhập (VNĐ) <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <input type="number" class="form-control" th:field="*{unitCost}" min="0" step="0.01" required>
                                    <span class="input-group-text bg-light">VNĐ</span>
                                </div>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                            <a th:href="@{/staff/stock-imports/{id}(id=${editForm.importId})}" class="btn btn-outline-secondary">Hủy</a>
                            <button type="submit" class="btn btn-pet-outline">
                                Lưu Thay Đổi
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
