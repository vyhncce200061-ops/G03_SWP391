<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-layout}">
<head>
    <title>Cảnh Báo Hết Hàng</title>
</head>
<body>
<div layout:fragment="admin-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0 text-danger">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            Cảnh Báo Tồn Kho
        </h4>
        <a th:href="@{/staff/stock-imports/create}" class="btn btn-pet-primary"><i class="bi bi-plus-lg me-1"></i>Tạo Phiếu Nhập Kho</a>
    </div>

    <div class="card border-0 shadow-sm rounded-4 p-3">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>Sản phẩm</th>
                    <th>Biến thể (SKU)</th>
                    <th class="text-center">Tồn kho hiện tại</th>
                    <th class="text-center">Trạng thái</th>
                    <th class="text-center">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="v : ${lowStockVariants}">
                    <td class="fw-semibold" th:text="${v.product.name}">Tên SP</td>
                    <td th:text="${v.variantName + ' (' + v.skuCode + ')'}">SKU</td>

                    <!-- Current Stock Column -->
                    <td class="text-center">
                        <span th:if="${v.stockQuantity == 0}" class="badge bg-danger-subtle text-danger-emphasis fs-6" th:text="${v.stockQuantity}">0</span>
                        <span th:if="${v.stockQuantity > 0}" class="badge bg-warning-subtle text-warning-emphasis fs-6" th:text="${v.stockQuantity}">2</span>
                    </td>

                    <!-- Status Column -->
                    <td class="text-center">
                        <span th:if="${v.stockQuantity == 0}" class="badge status-badge bg-danger px-3 py-2">Hết hàng</span>
                        <span th:if="${v.stockQuantity > 0}" class="badge status-badge bg-warning px-3 py-2">Sắp hết hàng</span>
                    </td>

                    <!-- Action Column -->
                    <td class="text-center">
                        <a th:href="@{/staff/stock-imports/create}" class="btn btn-sm btn-pet-outline">
                            Nhập thêm
                        </a>
                    </td>
                </tr>
                <!-- Empty state -->
                <tr th:if="${#lists.isEmpty(lowStockVariants)}">
                    <td colspan="5" class="text-center text-muted py-4">
                        Không có sản phẩm nào đang ở mức tồn kho thấp.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
