<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-layout}">
<head>
    <title th:text="${productForm.id != null ? 'Chỉnh Sửa Sản Phẩm' : 'Thêm Sản Phẩm Mới'}">Sản Phẩm</title>
</head>
<body>
<div layout:fragment="admin-content">
    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="page-title" th:text="${productForm.id != null ? 'Chỉnh Sửa Sản Phẩm' : 'Thêm Sản Phẩm Mới'}">
            Sản Phẩm
        </h4>
        <a th:href="@{${productBasePath}}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>Quay lại danh sách
        </a>
    </div>

    <div class="card border-0 shadow-sm rounded-4 p-4 position-relative">
        <!-- Loading Overlay (Hidden by default) -->
        <div id="loadingOverlay" class="position-absolute top-0 start-0 w-100 h-100 d-none justify-content-center align-items-center bg-white bg-opacity-75 rounded-4" style="z-index: 1050;">
            <div class="text-center">
                <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
                <p class="mt-3 fw-semibold text-muted">Đang tải ảnh và lưu dữ liệu...</p>
            </div>
        </div>

        <form id="productForm" th:action="@{${productForm.id != null ? productBasePath + '/' + productForm.id + '/edit' : productBasePath + '/create'}}"
              th:object="${productForm}" method="post" enctype="multipart/form-data">

            <div class="row g-4">
                <!-- LEFT COLUMN: MAIN INFORMATION -->
                <div class="col-lg-8">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label fw-semibold">Tên sản phẩm <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">URL Slug <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{slug}" th:classappend="${#fields.hasErrors('slug')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('slug')}" th:errors="*{slug}"></div>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Danh mục <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{categoryId}" th:classappend="${#fields.hasErrors('categoryId')} ? 'is-invalid'">
                                <option value="">-- Chọn danh mục --</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Thương hiệu</label>
                            <select class="form-select" th:field="*{brandId}">
                                <option value="">-- Không chọn --</option>
                                <option th:each="b : ${brands}" th:value="${b.id}" th:text="${b.name}"></option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Loài thú cưng <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{petType}">
                                <option value="DOG">Chó (DOG)</option>
                                <option value="CAT">Mèo (CAT)</option>
                                <option value="BOTH">Cả hai (BOTH)</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold">Mô tả ngắn</label>
                            <textarea class="form-control" th:field="*{shortDescription}" rows="2"></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Mô tả chi tiết</label>
                            <textarea class="form-control" th:field="*{description}" rows="5"></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Hướng dẫn sử dụng</label>
                            <textarea class="form-control" th:field="*{usageInstructions}" rows="3"></textarea>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Trạng thái <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{status}">
                                <option value="ACTIVE">Hoạt động (ACTIVE)</option>
                                <option value="HIDDEN">Ẩn (HIDDEN)</option>
                                <option value="DISCONTINUED">Ngừng kinh doanh (DISCONTINUED)</option>
                            </select>
                        </div>
                        <div class="col-md-6 d-flex align-items-center pt-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" th:field="*{isFeatured}">
                                <label class="form-check-label fw-semibold">Sản phẩm nổi bật (Featured)</label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- RIGHT COLUMN: IMAGE UPLOAD AREA -->
                <div class="col-lg-4">
                    <div class="card border border-light-subtle bg-light rounded-3 p-3 h-100">
                        <label class="form-label fw-bold mb-3"><i class="bi bi-images me-2"></i>Hình ảnh sản phẩm</label>

                        <!-- Display existing images if editing -->
                        <div th:if="${productForm.id != null and !productForm.existingImageUrls.isEmpty()}">
                            <p class="small text-muted mb-2 fw-semibold">Ảnh hiện tại (Chọn ảnh đại diện):</p>
                            <div class="d-flex flex-wrap gap-3 mb-4">
                                <div th:each="imgUrl, stat : ${productForm.existingImageUrls}" class="text-center position-relative">
                                    <img th:data-fallback-src="@{/images/product-placeholder.svg}" th:src="@{${imgUrl}}" class="img-thumbnail rounded shadow-sm fade-in"
                                         style="width: 85px; height: 85px; object-fit: cover;">
                                    <!-- Radio button to select primary image -->
                                    <div class="form-check d-flex justify-content-center mt-2">
                                        <input class="form-check-input" type="radio" th:field="*{primaryImageId}"
                                               th:value="${productForm.existingImageIds[stat.index]}"
                                               style="transform: scale(1.2); cursor: pointer;">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- File input for new images -->
                        <label class="form-label small fw-semibold text-muted mb-2" th:text="${productForm.id != null ? 'Tải thêm ảnh mới:' : 'Tải ảnh lên:'}">Tải ảnh lên:</label>
                        <div class="input-group mb-2">
                            <label class="input-group-text bg-white border-end-0" for="imageInput"><i class="bi bi-folder2-open"></i></label>
                            <input class="form-control border-start-0 ps-0" type="file" id="imageInput" name="imageFiles" accept=".jpg, .jpeg, .png" multiple>
                        </div>

                        <small class="text-muted d-block mb-3" style="font-size: 0.75rem;">
                            <i class="bi bi-info-circle me-1"></i> Chỉ nhận file định dạng .JPG, .JPEG, .PNG.
                        </small>

                        <!-- Container for JS preview -->
                        <p class="small text-muted mb-2 fw-semibold d-none" id="previewLabel">Ảnh xem trước:</p>
                        <div id="previewContainer" class="d-flex flex-wrap gap-3"></div>
                    </div>
                </div>
            </div>

            <!-- Submit Button -->
            <div class="mt-4 pt-3 border-top">
                <button type="submit" class="btn btn-pet-outline">
                    Lưu Sản Phẩm
                </button>
            </div>
        </form>
    </div>
    <!-- External JS file for image preview and loading state -->
    <script th:src="@{/js/product-form.js}"></script>
</div>
</body>
</html>
