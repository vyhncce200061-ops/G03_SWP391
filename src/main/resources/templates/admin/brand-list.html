<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/admin-layout}">
<head><title>Quản lý thương hiệu - PetShop</title></head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
        <div><h1 class="h4 mb-1">Quản lý thương hiệu</h1><p class="text-muted mb-0">Quản lý thông tin và logo thương hiệu.</p></div>
        <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#brandModal"
                data-brand-title="Thêm thương hiệu" data-brand-submit="Thêm thương hiệu"
                th:attr="data-brand-action=@{/admin/brands/create}">
            <i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Thêm thương hiệu
        </button>
    </div>
    <div class="card shadow-sm">
        <div class="card-header bg-white"><strong>Danh sách thương hiệu</strong><span class="badge bg-secondary ms-2" th:text="${#lists.size(brands)}">0</span></div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead><tr><th>ID</th><th>Tên thương hiệu</th><th>Mô tả</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
                <tbody>
                <tr th:each="brand : ${brands}" th:attr="data-brand-id=${brand.id}">
                    <td th:text="${brand.id}"></td>
                    <td><div class="brand-identity">
                        <img th:if="${!#strings.isEmpty(brand.logoUrl)}" th:src="${brand.logoUrl}" alt="" class="brand-table-logo" data-brand-logo>
                        <span class="fw-semibold" th:text="${brand.name}"></span>
                    </div></td>
                    <td class="brand-description" th:text="${#strings.isEmpty(brand.description) ? 'Chưa có mô tả' : brand.description}"></td>
                    <td><span class="badge" th:classappend="${brand.isActive ? 'bg-success-subtle text-success' : 'bg-secondary-subtle text-secondary'}"
                              th:text="${brand.isActive ? 'Đang hoạt động' : 'Ngừng hoạt động'}"></span></td>
                    <td><div class="d-flex flex-wrap gap-2">
                        <button type="button" class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#brandModal"
                                data-brand-title="Chỉnh sửa thương hiệu" data-brand-submit="Lưu thay đổi"
                                th:attr="data-brand-action=@{/admin/brands/update/{id}(id=${brand.id})},data-brand-name=${brand.name},data-brand-description=${brand.description},data-brand-logo=${brand.logoUrl}">
                            <i class="bi bi-pencil-square me-1" aria-hidden="true"></i>Sửa
                        </button>
                        <form th:action="@{/admin/brands/toggle-status/{id}(id=${brand.id})}" method="post">
                            <button type="submit" class="btn btn-sm btn-outline-secondary" th:text="${brand.isActive ? 'Ngừng hoạt động' : 'Kích hoạt'}"></button>
                        </form>
                        <form th:action="@{/admin/brands/delete/{id}(id=${brand.id})}" method="post" onsubmit="return confirm('Bạn có chắc muốn xóa thương hiệu này?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash me-1" aria-hidden="true"></i>Xóa</button>
                        </form>
                    </div></td>
                </tr>
                <tr th:if="${#lists.isEmpty(brands)}"><td colspan="5" class="text-center text-muted py-5">Chưa có thương hiệu nào. Chọn “Thêm thương hiệu” để bắt đầu.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="modal fade" id="brandModal" tabindex="-1" aria-labelledby="brandModalTitle" aria-hidden="true" th:attr="data-open=${brandModalOpen}">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <form id="brandForm" th:object="${brandForm}" method="post" enctype="multipart/form-data"
                      th:action="${editingBrandId == null} ? @{/admin/brands/create} : @{/admin/brands/update/{id}(id=${editingBrandId})}">
                    <div class="modal-header">
                        <h2 class="modal-title h5" id="brandModalTitle" th:text="${editingBrandId == null ? 'Thêm thương hiệu' : 'Chỉnh sửa thương hiệu'}"></h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="brandName" class="form-label fw-semibold">Tên thương hiệu <span class="text-danger">*</span></label>
                            <input id="brandName" th:field="*{name}" class="form-control" th:errorclass="is-invalid" maxlength="150" placeholder="Ví dụ: Royal Canin" required>
                            <div class="invalid-feedback" th:errors="*{name}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="brandDescription" class="form-label fw-semibold">Mô tả</label>
                            <textarea id="brandDescription" th:field="*{description}" class="form-control" th:errorclass="is-invalid" maxlength="1000" rows="4" placeholder="Thông tin thương hiệu"></textarea>
                            <div class="invalid-feedback" th:errors="*{description}"></div>
                        </div>
                        <div>
                            <label for="brandLogoFile" class="form-label fw-semibold">Logo thương hiệu</label>
                            <div class="brand-logo-preview mb-3" id="brandLogoPreviewBox" th:hidden="${#strings.isEmpty(currentLogoUrl)}">
                                <img id="brandLogoPreview" th:src="${currentLogoUrl}" alt="Logo thương hiệu đang chọn"
                                     th:attr="data-stored-src=${currentLogoUrl}">
                            </div>
                            <input id="brandLogoFile" th:field="*{logoFile}" type="file" class="form-control"
                                   accept="image/png,image/jpeg,image/gif" th:errorclass="is-invalid" aria-describedby="brandLogoHelp">
                            <div class="invalid-feedback" th:errors="*{logoFile}"></div>
                            <div id="brandLogoHelp" class="form-text">PNG, JPG hoặc GIF, tối đa 2 MB và 4096 × 4096 px. Không chọn ảnh mới để giữ logo hiện tại.</div>
                            <div class="form-check mt-3" id="brandRemoveLogoBox" th:hidden="${#strings.isEmpty(currentLogoUrl)}">
                                <input id="brandRemoveLogo" th:field="*{removeLogo}" type="checkbox" class="form-check-input">
                                <label for="brandRemoveLogo" class="form-check-label">Gỡ logo hiện tại</label>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button id="brandSubmit" type="submit" class="btn btn-success" th:text="${editingBrandId == null ? 'Thêm thương hiệu' : 'Lưu thay đổi'}"></button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<th:block layout:fragment="custom-js"><script th:src="@{/js/admin-brand.js}" defer></script></th:block>
</body></html>
