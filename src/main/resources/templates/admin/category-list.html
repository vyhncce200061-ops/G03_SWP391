<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/admin-layout}">
<head><title>Quản lý danh mục - PetShop</title></head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
        <div>
            <h1 class="h4 mb-2">Quản lý danh mục</h1>
            <div class="text-muted small"><span th:text="${#lists.size(categories)}"></span> danh mục cha <span class="mx-2" aria-hidden="true">·</span><span th:text="${childCount}"></span> danh mục con</div>
        </div>
        <a th:href="@{/admin/categories/create}" class="btn btn-success"><i class="bi bi-plus-lg me-2" aria-hidden="true"></i>Thêm danh mục cha</a>
    </div>
    <div class="category-management-tree">
        <section class="card category-group mb-3" th:each="parent : ${categories}"
                 th:id="${'category-' + parent.id}" th:attr="data-category-id=${parent.id}">
            <div class="category-group-header">
                <h2 class="category-parent-heading">
                    <button type="button" class="category-group-toggle" data-bs-toggle="collapse"
                            th:attr="data-bs-target=${'#children-' + parent.id},aria-controls=${'children-' + parent.id},aria-expanded=${expandedParentId == parent.id},aria-label=${'Danh mục ' + parent.name}">
                        <i class="bi bi-chevron-right category-chevron" aria-hidden="true"></i>
                        <i class="bi bi-folder2 category-folder" aria-hidden="true"></i>
                        <span class="category-parent-copy">
                            <span class="category-parent-name" th:text="${parent.name}"></span>
                            <span class="category-parent-meta"><code th:text="${parent.code}"></code><span th:text="${#lists.size(parent.children) + ' danh mục con'}"></span><span th:text="${'Thứ tự: ' + parent.sortOrder}"></span></span>
                        </span>
                    </button>
                </h2>
                <div class="category-parent-toolbar">
                    <span th:replace="~{fragments/category-actions :: status(${parent})}"></span>
                    <div th:replace="~{fragments/category-actions :: actions(${parent})}"></div>
                </div>
            </div>
            <div class="collapse" th:id="${'children-' + parent.id}" th:classappend="${expandedParentId == parent.id} ? 'show'">
                <div class="category-group-body">
                    <p th:if="${!#strings.isEmpty(parent.description)}" class="text-muted small mb-3" th:text="${parent.description}"></p>
                    <p th:unless="${parent.isActive}" class="small text-muted mb-3"><i class="bi bi-info-circle me-1" aria-hidden="true"></i>Danh mục cha đang ngừng hoạt động; các danh mục con trong nhánh này không hiển thị ở menu cửa hàng.</p>
                    <div class="table-responsive" th:unless="${#lists.isEmpty(parent.children)}">
                        <table class="table align-middle category-children-table mb-0">
                            <caption class="visually-hidden" th:text="${'Danh mục con của ' + parent.name}"></caption>
                            <thead><tr><th scope="col">Danh mục con</th><th scope="col">Mã danh mục</th><th scope="col">Thứ tự</th><th scope="col">Trạng thái</th><th scope="col">Thao tác</th></tr></thead>
                            <tbody><tr th:each="child : ${parent.children}" th:attr="data-category-id=${child.id},data-parent-id=${parent.id}">
                                <td><div class="fw-semibold" th:text="${child.name}"></div><div th:if="${!#strings.isEmpty(child.description)}" class="small text-muted category-description" th:text="${child.description}"></div></td>
                                <td><code th:text="${child.code}"></code></td>
                                <td th:text="${child.sortOrder}"></td>
                                <td><span th:replace="~{fragments/category-actions :: status(${child})}"></span></td>
                                <td><div th:replace="~{fragments/category-actions :: actions(${child})}"></div></td>
                            </tr></tbody>
                        </table>
                    </div>
                    <p th:if="${#lists.isEmpty(parent.children)}" class="text-muted py-2 mb-2">Chưa có danh mục con.</p>
                    <div class="category-add-child">
                        <a class="btn btn-outline-success btn-sm" th:href="@{/admin/categories/{id}/children/create(id=${parent.id})}"><i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Thêm danh mục con</a>
                    </div>
                </div>
            </div>
        </section>
        <div th:if="${#lists.isEmpty(categories)}" class="card text-center p-5 text-muted"><i class="bi bi-folder2 fs-2 mb-3" aria-hidden="true"></i>Chưa có danh mục nào.</div>
    </div>
</div>
</body></html>
