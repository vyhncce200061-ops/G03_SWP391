<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/admin-layout}">
<head><title>Báo cáo đánh giá</title></head><body><div layout:fragment="admin-header-title">Báo cáo đánh giá</div>
<div layout:fragment="admin-content" class="report-page">
    <div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h4 mb-2">Đánh giá theo sản phẩm</h1><p class="text-muted small mb-0">Theo ngày tạo đánh giá. Điểm bình quân gồm cả đánh giá đang ẩn.</p></div><a th:href="@{/admin/reviews}" class="btn btn-outline-primary"><i class="bi bi-chat-square-text me-2" aria-hidden="true"></i>Quản lý đánh giá</a></div>
    <div class="card p-4 mb-4"><form method="get" class="row g-3 align-items-end"><div class="col-md-4"><label for="reviewStart" class="form-label">Từ ngày</label><input id="reviewStart" class="form-control" type="date" name="startDate" th:value="${startDate}" required></div><div class="col-md-4"><label for="reviewEnd" class="form-label">Đến ngày</label><input id="reviewEnd" class="form-control" type="date" name="endDate" th:value="${endDate}" required></div><div class="col-md-4"><button class="btn btn-primary w-100"><i class="bi bi-funnel me-2" aria-hidden="true"></i>Xem báo cáo</button></div></form></div>
    <div class="card overflow-hidden"><div class="card-header p-4"><h2 class="h6 mb-0">Tổng hợp đánh giá</h2></div><div class="table-responsive"><table class="table"><thead><tr><th>Sản phẩm</th><th>Số đánh giá</th><th>Điểm bình quân</th><th>Công khai</th><th>Đang ẩn</th></tr></thead><tbody><tr th:each="row : ${reviewStats}"><td class="fw-semibold" th:text="${row[0]}"></td><td th:text="${row[1]}"></td><td><i class="bi bi-star-fill text-warning me-1" aria-hidden="true"></i><span th:text="${#numbers.formatDecimal(row[2],1,'POINT',1,'COMMA')}"></span></td><td th:text="${row[3]}"></td><td th:text="${row[4]}"></td></tr><tr th:if="${#lists.isEmpty(reviewStats)}"><td colspan="5" class="text-center text-muted py-5"><i class="bi bi-chat-square-heart fs-3 d-block mb-2" aria-hidden="true"></i>Chưa có đánh giá trong kỳ này.</td></tr></tbody></table></div></div>
</div></body></html>
