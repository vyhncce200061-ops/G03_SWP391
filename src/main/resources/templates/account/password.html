<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{${#authorization.expression('hasAnyRole(''ADMIN'',''STAFF'')') ? 'layout/admin-layout' : 'layout/main-layout'}}">
<head><title>Đổi mật khẩu</title></head><body>
<div layout:fragment="content" class="container py-5">
    <div class="card account-password-card">
        <span class="stat-icon stat-icon-primary mb-3"><i class="bi bi-shield-lock" aria-hidden="true"></i></span>
        <h1 class="h4 mb-2">Đổi mật khẩu</h1>
        <p class="text-muted small mb-4">Nhập mật khẩu hiện tại và chọn mật khẩu mới để bảo vệ tài khoản của bạn.</p>
        <form th:action="@{/account/password}" th:object="${passwordForm}" method="post">
            <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger"><p class="mb-1" th:each="err : ${#fields.errors('*')}" th:text="${err}"></p></div>
            <div class="mb-3"><label for="currentPassword" class="form-label">Mật khẩu hiện tại</label><input class="form-control" type="password" th:field="*{currentPassword}" required autocomplete="current-password"></div>
            <div class="mb-3"><label for="newPassword" class="form-label">Mật khẩu mới</label><input class="form-control" type="password" th:field="*{newPassword}" required minlength="6" autocomplete="new-password"><div class="form-text">Tối thiểu 6 ký tự.</div></div>
            <div class="mb-4"><label for="confirmNewPassword" class="form-label">Xác nhận mật khẩu mới</label><input class="form-control" type="password" th:field="*{confirmNewPassword}" required autocomplete="new-password"></div>
            <button type="submit" class="btn btn-primary w-100">Lưu và đăng nhập lại</button>
        </form>
    </div>
</div></body></html>
