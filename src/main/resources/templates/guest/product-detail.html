<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">
<head>
    <title th:text="${product.name}">Chi Tiết Sản Phẩm</title>
</head>
<body>
<div layout:fragment="content" class="detail-screen py-5">


    <div class="container">
        <div class="row g-5">
            <div class="col-md-6 text-center product-image-panel">
                <img th:data-fallback-src="@{/images/product-placeholder.svg}" th:src="${product.displayImageUrl}" th:alt="${product.name}" class="img-fluid rounded-4 shadow-sm">
            </div>
            <div class="col-md-6">
                <span class="badge bg-secondary mb-2" th:text="${product.petType}">DOG</span>
                <div class="d-flex align-items-start justify-content-between gap-3">
                    <div class="flex-grow-1" style="min-width: 0; overflow-wrap: anywhere;">
                        <h2 class="text-body" th:text="${product.name}">Tên sản phẩm</h2>
                        <p class="text-body" th:text="${product.shortDescription}">Mô tả ngắn sản phẩm</p>
                    </div>
                    <form th:if="${!#authorization.expression('hasAnyRole(''ADMIN'',''STAFF'')')}" id="wishlistForm" th:action="@{/customer/wishlist/add/{id}(id=${product.id})}"
                          th:attr="data-remove-url=@{/customer/wishlist/remove/{id}(id=${product.id})}" method="post"
                          class="flex-shrink-0">
                        <button type="submit" class="btn btn-link text-danger text-decoration-none p-2 fs-4"
                                th:attr="aria-label=${wishlisted ? 'Đã lưu vào yêu thích' : 'Lưu vào yêu thích'},aria-pressed=${wishlisted}"
                                th:title="${wishlisted ? 'Đã lưu vào yêu thích' : 'Lưu vào yêu thích'}">
                            <i class="bi" th:classappend="${wishlisted ? 'bi-heart-fill' : 'bi-heart'}"
                               aria-hidden="true"></i>
                        </button>
                    </form>
                </div>
                <hr>

                <form th:action="@{/cart/add}" method="post" th:if="${!#lists.isEmpty(availableVariants) and !#authorization.expression('hasAnyRole(''ADMIN'',''STAFF'')')}">
                    <div class="mb-3">
                        <label for="productVariant" class="form-label text-body">Chọn Phân Loại:</label>
                        <select id="productVariant" class="form-select" name="variantId" required>
                            <option th:each="v : ${availableVariants}"
                                    th:value="${v.id}"
                                    th:data-stock="${v.stockQuantity}"
                                    th:data-price="${v.price}"
                                    th:data-color="${v.color != null ? v.color : ''}"
                                    th:data-weight="${v.weightKg != null ? v.weightKg : ''}"
                                    th:text="${v.variantName + (v.color != null and !v.color.isBlank() ? ' - Màu: ' + v.color : '') + (v.weightKg != null ? ' - ' + v.weightKg + 'kg' : '') + ' - ' + #numbers.formatDecimal(v.price, 0, 'POINT', 0, 'COMMA') + ' đ (Kho: ' + v.stockQuantity + ')'}">
                            </option>
                        </select>
                    </div>

                    <div id="variantDetails" class="mb-3 p-2 bg-light rounded text-muted small" style="display:none;">
                        <span id="variantColorSpan" class="me-3"></span>
                        <span id="variantWeightSpan" class="me-3"></span>
                        <span id="variantStockSpan" class="text-primary fw-semibold"></span>
                    </div>

                    <div class="mb-3">
                        <label for="productQuantity" class="form-label text-body">Số lượng:</label>
                        <input id="productQuantity" type="number" name="quantity" class="form-control" value="1" min="1" max="100"
                               style="width: 120px;">
                        <div id="stockNotice" class="form-text text-muted"></div>
                    </div>
                    <button type="submit" class="btn btn-pet-primary btn-lg w-100">
                        <i class="bi bi-cart-plus me-2"></i>Thêm Vào Giỏ Hàng
                    </button>
                </form>
                <p th:if="${#lists.isEmpty(availableVariants)}" class="alert alert-light border" role="status">Hiện chưa có phân loại còn hàng cho sản phẩm này.</p>


                <div class="mt-4">
                    <h5 class="text-body mb-3">Mô tả chi tiết:</h5>

                    <div class="text-body"
                         style="white-space: pre-line; line-height: 1.8;"
                         th:text="${product.description != null and !product.description.isBlank()
             ? product.description
             : 'Chưa có mô tả chi tiết cho sản phẩm này.'}">
                    </div>
                </div>
            </div>
        </div>
    </div>
<section class="container my-4"><div class="card p-3"><h2 class="h5">Đánh giá từ khách đã mua hàng</h2><p th:if="${reviews.empty}">Chưa có đánh giá công khai.</p><article th:each="r : ${reviews.content}" class="border-bottom py-3"><strong th:text="${r.rating + '/5 sao'}"></strong> <small th:text="${#temporals.format(r.createdAt,'dd/MM/yyyy')}"></small><p style="white-space:pre-wrap;overflow-wrap:anywhere" th:text="${r.comment}"></p><div th:if="${r.replyText != null}" class="border-start border-3 ps-3 mt-3"><strong>Phản hồi từ PetShop</strong><small class="d-block text-muted" th:text="${#temporals.format(r.repliedAt,'dd/MM/yyyy HH:mm')}"></small><p style="white-space:pre-wrap;overflow-wrap:anywhere" th:text="${r.replyText}"></p></div></article><nav class="d-flex gap-3"><a th:if="${reviews.hasPrevious()}" th:href="@{/products/{slug}(slug=${product.slug},reviewPage=${reviews.number-1})}">Trước</a><a th:if="${reviews.hasNext()}" th:href="@{/products/{slug}(slug=${product.slug},reviewPage=${reviews.number+1})}">Sau</a></nav></div></section>
</div>
<th:block layout:fragment="custom-js">
    <script th:src="@{/js/wishlist.js}" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const variantSelect = document.getElementById('productVariant');
            const quantityInput = document.getElementById('productQuantity');
            const detailsBox = document.getElementById('variantDetails');
            const colorSpan = document.getElementById('variantColorSpan');
            const weightSpan = document.getElementById('variantWeightSpan');
            const stockSpan = document.getElementById('variantStockSpan');
            const stockNotice = document.getElementById('stockNotice');
            const submitBtn = document.querySelector('form[action*="/cart/add"] button[type="submit"]');

            function updateVariant() {
                if (!variantSelect) return;
                const selected = variantSelect.options[variantSelect.selectedIndex];
                if (!selected) return;

                const stock = parseInt(selected.getAttribute('data-stock'), 10) || 0;
                const color = selected.getAttribute('data-color') || '';
                const weight = selected.getAttribute('data-weight') || '';

                if (color) {
                    colorSpan.textContent = 'Màu sắc: ' + color;
                    colorSpan.style.display = 'inline';
                } else {
                    colorSpan.style.display = 'none';
                }

                if (weight) {
                    weightSpan.textContent = 'Khối lượng: ' + weight + ' kg';
                    weightSpan.style.display = 'inline';
                } else {
                    weightSpan.style.display = 'none';
                }

                stockSpan.textContent = 'Còn lại: ' + stock + ' sản phẩm trong kho';
                if (detailsBox) detailsBox.style.display = 'block';

                if (stock <= 0) {
                    quantityInput.value = 0;
                    quantityInput.min = 0;
                    quantityInput.max = 0;
                    quantityInput.disabled = true;
                    if (submitBtn) {
                        submitBtn.disabled = true;
                        submitBtn.innerHTML = '<i class="bi bi-x-circle me-2"></i>Tạm Hết Hàng';
                    }
                    if (stockNotice) stockNotice.textContent = 'Biến thể này hiện đã hết hàng.';
                } else {
                    quantityInput.disabled = false;
                    quantityInput.min = 1;
                    quantityInput.max = stock;
                    let currentVal = parseInt(quantityInput.value, 10);
                    if (isNaN(currentVal) || currentVal < 1) {
                        quantityInput.value = 1;
                    } else if (currentVal > stock) {
                        quantityInput.value = stock;
                    }
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i class="bi bi-cart-plus me-2"></i>Thêm Vào Giỏ Hàng';
                    }
                    if (stockNotice) stockNotice.textContent = 'Tối đa có thể mua: ' + stock + ' sản phẩm';
                }
            }

            if (variantSelect) {
                variantSelect.addEventListener('change', updateVariant);
                updateVariant();
            }

            if (quantityInput) {
                const validateQty = () => {
                    const max = parseInt(quantityInput.max, 10);
                    const min = parseInt(quantityInput.min, 10) || 1;
                    let val = parseInt(quantityInput.value, 10);
                    if (isNaN(val) || val < min) {
                        quantityInput.value = min;
                    } else if (max > 0 && val > max) {
                        quantityInput.value = max;
                        if (stockNotice) {
                            stockNotice.textContent = 'Đã tự động điều chỉnh về số lượng tối đa còn lại (' + max + ')';
                        }
                    }
                };
                quantityInput.addEventListener('input', validateQty);
                quantityInput.addEventListener('change', validateQty);
            }
        });
    </script>
</th:block>
</body>
</html>
