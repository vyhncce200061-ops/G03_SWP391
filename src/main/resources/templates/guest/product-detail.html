<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">
<head>
    <title th:text="${product.name}">Chi Tiết Sản Phẩm</title>
</head>
<body>
<div layout:fragment="content" class="py-5">
    <div class="container">
        <div class="row g-5">
            <div class="col-md-6 text-center">
                <img th:src="${product.displayImageUrl}" th:alt="${product.name}" class="img-fluid rounded-4 shadow-sm">
            </div>
            <div class="col-md-6">
                <span class="badge bg-secondary mb-2" th:text="${product.petType}">DOG</span>
                <div class="d-flex align-items-start justify-content-between gap-3">
                    <div class="flex-grow-1" style="min-width: 0; overflow-wrap: anywhere;">
                        <h2 class="text-white" th:text="${product.name}">Tên sản phẩm</h2>
                        <p class="text-white" th:text="${product.shortDescription}">Mô tả ngắn sản phẩm</p>
                    </div>
                    <form id="wishlistForm" th:action="@{/customer/wishlist/add/{id}(id=${product.id})}"
                          th:attr="data-remove-url=@{/customer/wishlist/remove/{id}(id=${product.id})}" method="post"
                          class="flex-shrink-0">
                        <button type="submit" class="btn btn-link text-danger text-decoration-none p-2 fs-4"
                                th:attr="aria-label=${wishlisted ? 'Đã lưu vào yêu thích' : 'Lưu vào yêu thích'},aria-pressed=${wishlisted}"
                                th:title="${wishlisted ? 'Đã lưu vào yêu thích' : 'Lưu vào yêu thích'}">
                            <i class="bi" th:classappend="${wishlisted ? 'bi-heart-fill' : 'bi-heart'}"
                               aria-hidden="true"></i>
                        </button>
                    </form>
                </div>
                <hr>

                <form th:action="@{/cart/add}" method="post" th:if="${!#lists.isEmpty(availableVariants)}">
                    <div class="mb-3">
                        <label class="form-label text-white">Chọn Phân Loại:</label>
                        <select class="form-select" name="variantId" required>
                            <option th:each="v : ${availableVariants}"
                                    th:value="${v.id}"
                                    th:text="${v.variantName + ' - ' + #numbers.formatDecimal(v.price, 0, 'POINT', 0, 'COMMA') + ' đ (Kho: ' + v.stockQuantity + ')'}">
                            </option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-white">Số lượng:</label>
                        <input type="number" name="quantity" class="form-control" value="1" min="1" max="100"
                               style="width: 120px;">
                    </div>
                    <button type="submit" class="btn btn-pet-primary btn-lg w-100">
                        <i class="bi bi-cart-plus me-2"></i>Thêm Vào Giỏ Hàng
                    </button>
                </form>


                <div class="mt-4">
                    <h5 class="text-white mb-3">Mô tả chi tiết:</h5>

                    <div class="text-white"
                         style="white-space: pre-line; line-height: 1.8;"
                         th:text="${product.description != null and !product.description.isBlank()
             ? product.description
             : 'Chưa có mô tả chi tiết cho sản phẩm này.'}">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<th:block layout:fragment="custom-js">
    <script th:src="@{/js/wishlist.js}" defer></script>
</th:block>
</body>
</html>
