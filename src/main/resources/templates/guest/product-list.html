
<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">

<head>
    <title>Danh Sách Sản Phẩm</title>
</head>

<body>
<div layout:fragment="content">

    <div class="container py-4">
        <div class="row g-4">

            <!-- SIDEBAR: CATEGORY FILTER -->
            <aside class="col-lg-3">
                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-body">

                        <h5 class="card-title fw-bold border-bottom pb-3 mb-3">
                            <i class="bi bi-sliders text-success"></i>
                            Bộ Lọc Sản Phẩm
                        </h5>

                        <h6 class="text-uppercase text-muted fw-bold small mb-3">
                            Danh mục
                        </h6>

                        <form method="get" th:action="@{/products}">
                            <input type="hidden" name="keyword"
                                   th:value="${keyword}">
                            <input type="hidden" name="sort"
                                   th:value="${sort}">
                            <input type="hidden" name="priceRange"
                                   th:value="${priceRange}">
                            <input type="hidden" name="brandId"
                                   th:value="${selectedBrandId}">

                            <div class="d-grid gap-2">

                                <button type="submit"
                                        name="categoryId"
                                        value=""
                                        class="btn text-start fw-medium rounded-2"
                                        th:classappend="${selectedCategoryId == null or selectedCategoryId == ''} ? 'btn-success text-white' : 'btn-light'">
                                    🐾 Tất cả sản phẩm
                                </button>

                                <button type="submit"
                                        th:each="category : ${categories}"
                                        name="categoryId"
                                        th:value="${category.id}"
                                        class="btn text-start fw-medium rounded-2"
                                        th:classappend="${selectedCategoryId != null and selectedCategoryId.toString() == category.id.toString()} ? 'btn-success text-white' : 'btn-light'"
                                        th:text="${category.name}">
                                    Danh mục
                                </button>

                            </div>
                        </form>

                    </div>
                </div>
            </aside>

            <!-- PRODUCT LIST -->
            <section class="col-lg-9">

                <!-- FILTER AND SORT -->
                <div class="card border-0 shadow-sm rounded-3 mb-4">
                    <div class="card-body">

                        <form method="get"
                              th:action="@{/products}"
                              class="row g-3 align-items-end">

                            <input type="hidden" name="categoryId"
                                   th:value="${selectedCategoryId}">
                            <input type="hidden" name="keyword"
                                   th:value="${keyword}">

                            <!-- PRICE RANGE -->
                            <div class="col-12 col-md-4">
                                <label for="priceRange"
                                       class="form-label fw-semibold">
                                    <i class="bi bi-currency-dollar text-success"></i>
                                    Khoảng giá
                                </label>

                                <select name="priceRange"
                                        id="priceRange"
                                        class="form-select">
                                    <option value=""
                                            th:selected="${priceRange == null or priceRange == ''}">
                                        Tất cả mức giá
                                    </option>
                                    <option value="under100"
                                            th:selected="${priceRange == 'under100'}">
                                        Dưới 100.000đ
                                    </option>
                                    <option value="100to300"
                                            th:selected="${priceRange == '100to300'}">
                                        100.000đ - 300.000đ
                                    </option>
                                    <option value="300to500"
                                            th:selected="${priceRange == '300to500'}">
                                        300.000đ - 500.000đ
                                    </option>
                                    <option value="over500"
                                            th:selected="${priceRange == 'over500'}">
                                        Trên 500.000đ
                                    </option>
                                </select>
                            </div>

                            <!-- BRAND -->
                            <div class="col-12 col-md-4">
                                <label for="brandId"
                                       class="form-label fw-semibold">
                                    <i class="bi bi-award text-success"></i>
                                    Thương hiệu
                                </label>

                                <select name="brandId"
                                        id="brandId"
                                        class="form-select">
                                    <option value="">Tất cả thương hiệu</option>

                                    <option th:each="brand : ${brands}"
                                            th:value="${brand.id}"
                                            th:text="${brand.name}"
                                            th:selected="${selectedBrandId != null and selectedBrandId.toString() == brand.id.toString()}">
                                        Thương hiệu
                                    </option>
                                </select>
                            </div>

                            <!-- SORT -->
                            <div class="col-12 col-md-4">
                                <label for="sort"
                                       class="form-label fw-semibold">
                                    <i class="bi bi-sort-down text-success"></i>
                                    Sắp xếp
                                </label>

                                <select name="sort"
                                        id="sort"
                                        class="form-select">
                                    <option value="newest"
                                            th:selected="${sort == 'newest'}">
                                        Mới nhất
                                    </option>
                                    <option value="asc"
                                            th:selected="${sort == 'asc'}">
                                        Tên A - Z
                                    </option>
                                    <option value="desc"
                                            th:selected="${sort == 'desc'}">
                                        Tên Z - A
                                    </option>
                                    <option value="priceAsc"
                                            th:selected="${sort == 'priceAsc'}">
                                        Giá thấp đến cao
                                    </option>
                                    <option value="priceDesc"
                                            th:selected="${sort == 'priceDesc'}">
                                        Giá cao đến thấp
                                    </option>
                                </select>
                            </div>

                            <!-- BUTTONS -->
                            <div class="col-12 d-flex justify-content-end gap-2">
                                <a th:href="@{/products(
                                        categoryId=${selectedCategoryId},
                                        keyword=${keyword}
                                   )}"
                                   class="btn btn-outline-secondary">
                                    <i class="bi bi-arrow-counterclockwise"></i>
                                    Xóa lọc
                                </a>

                                <button type="submit"
                                        class="btn btn-success px-4">
                                    <i class="bi bi-funnel"></i>
                                    Áp dụng
                                </button>
                            </div>

                        </form>
                    </div>
                </div>

                <!-- RESULT COUNT -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="text-muted small">
                        Tìm thấy
                        <strong th:text="${productPage.totalElements}">0</strong>
                        sản phẩm
                    </span>
                </div>

                <!-- EMPTY STATE -->
                <div th:if="${productPage == null or productPage.empty}"
                     class="card border-0 shadow-sm text-center py-5">
                    <div class="card-body">
                        <p class="fs-1 mb-2">🐾</p>
                        <h5 class="fw-bold">Không tìm thấy sản phẩm</h5>
                        <p class="text-muted small">
                            Hãy thử thay đổi danh mục hoặc bộ lọc nhé.
                        </p>
                        <a th:href="@{/products}"
                           class="btn btn-success rounded-2 px-4">
                            Xem tất cả sản phẩm
                        </a>
                    </div>
                </div>

                <!-- PRODUCT GRID -->
                <div th:if="${productPage != null and !productPage.empty}"
                     id="productGrid"
                     class="row row-cols-1 row-cols-sm-2 row-cols-xl-3 g-4">

                    <div class="col"
                         th:each="product : ${productPage.content}">

                        <div class="card h-100 border-0 shadow-sm rounded-3 overflow-hidden">

                            <!-- IMAGE -->
                            <a th:href="@{/products/{slug}(slug=${product.slug})}"
                               class="text-decoration-none bg-white">
                                <div class="d-flex align-items-center justify-content-center p-3"
                                     style="height: 220px;">

                                    <img th:if="${product.primaryImageUrl != null and !#strings.isEmpty(product.primaryImageUrl)}"
                                         th:src="${product.primaryImageUrl}"
                                         th:alt="${product.name}"
                                         class="img-fluid"
                                         style="max-height: 100%; max-width: 100%; object-fit: contain;">

                                    <div th:if="${product.primaryImageUrl == null or #strings.isEmpty(product.primaryImageUrl)}"
                                         class="text-center text-muted">
                                        <i class="bi bi-image fs-1"></i>
                                        <p class="small mb-0">Chưa có hình ảnh</p>
                                    </div>

                                </div>
                            </a>

                            <!-- PRODUCT INFORMATION -->
                            <div class="card-body d-flex flex-column">

                                <p class="small text-muted mb-2"
                                   th:text="${product.categoryName != null ? product.categoryName : 'Chưa phân loại'}">
                                    Danh mục
                                </p>

                                <h6 class="card-title fw-bold">
                                    <a th:href="@{/products/{slug}(slug=${product.slug})}"
                                       class="text-dark text-decoration-none"
                                       th:text="${product.name}">
                                        Tên sản phẩm
                                    </a>
                                </h6>

                                <p class="small text-muted mb-2"
                                   th:if="${product.brandName != null}"
                                   th:text="${product.brandName}">
                                    Thương hiệu
                                </p>

                                <!-- PRODUCT PRICE -->
                                <div class="mb-3">
                                    <span class="text-success fw-bold fs-5"
                                          th:if="${product.minPrice != null}"
                                          th:text="${#numbers.formatDecimal(product.minPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                        Giá sản phẩm
                                    </span>

                                    <span class="text-muted small"
                                          th:if="${product.minPrice == null}">
                                        Chưa có giá
                                    </span>
                                </div>

                                <!-- DETAIL -->
                                <div class="mt-auto">
                                    <a th:href="@{/products/{slug}(slug=${product.slug})}"
                                       class="btn btn-outline-success w-100">
                                        Xem chi tiết
                                    </a>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>

                <!-- PAGINATION -->
                <nav th:if="${productPage != null and productPage.totalPages > 1}"
                     class="mt-4"
                     aria-label="Phân trang sản phẩm">

                    <ul class="pagination justify-content-center flex-wrap">

                        <li class="page-item"
                            th:classappend="${productPage.first} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/products(
                                    page=${productPage.number - 1},
                                    size=${productPage.size},
                                    keyword=${keyword},
                                    categoryId=${selectedCategoryId},
                                    sort=${sort},
                                    priceRange=${priceRange},
                                    brandId=${selectedBrandId}
                               )}">
                                Trước
                            </a>
                        </li>

                        <li class="page-item"
                            th:each="pageNumber : ${#numbers.sequence(0, productPage.totalPages - 1)}"
                            th:classappend="${pageNumber == productPage.number} ? 'active'">
                            <a class="page-link"
                               th:href="@{/products(
                                    page=${pageNumber},
                                    size=${productPage.size},
                                    keyword=${keyword},
                                    categoryId=${selectedCategoryId},
                                    sort=${sort},
                                    priceRange=${priceRange},
                                    brandId=${selectedBrandId}
                               )}"
                               th:text="${pageNumber + 1}">
                                1
                            </a>
                        </li>

                        <li class="page-item"
                            th:classappend="${productPage.last} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/products(
                                    page=${productPage.number + 1},
                                    size=${productPage.size},
                                    keyword=${keyword},
                                    categoryId=${selectedCategoryId},
                                    sort=${sort},
                                    priceRange=${priceRange},
                                    brandId=${selectedBrandId}
                               )}">
                                Sau
                            </a>
                        </li>

                    </ul>
                </nav>

            </section>
        </div>
    </div>

</div>
</body>
</html>
