<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">
<head><title>Sản phẩm yêu thích</title></head>
<body>
<div layout:fragment="content" class="container py-4">
    <h1 class="h3 mb-4 text-body">Sản phẩm yêu thích</h1>
    <!-- Success/error flash messages are rendered once by layout/main-layout. -->
    <p th:if="${items.empty}" class="alert alert-info">Bạn chưa lưu sản phẩm yêu thích nào.</p>
    <a th:href="@{/products}" class="btn btn-outline-primary mb-4">Tiếp tục xem sản phẩm</a>
    <div class="row g-3">
        <div th:each="item : ${items}" class="col-md-6 col-lg-4">
            <div class="card h-100 shadow-sm overflow-hidden">
                <img th:data-fallback-src="@{/images/product-placeholder.svg}" th:src="${item.product.displayImageUrl}" th:alt="${item.product.name}"
                     class="card-img-top bg-white" style="height: 220px; object-fit: contain; padding: 16px;">
                <div class="card-body d-flex flex-column">
                    <h2 class="h5" th:text="${item.product.name}"></h2>
                    <p th:text="${item.product.shortDescription}"></p>
                    <p th:if="${item.product.status.name() == 'ACTIVE' and !item.product.availableInStock}"
                       class="text-warning-emphasis">Tạm hết hàng</p>
                    <p th:unless="${item.product.status.name() == 'ACTIVE'}" class="text-secondary">Sản phẩm hiện không còn kinh doanh.</p>
                    <div class="d-flex flex-wrap gap-2 mt-auto">
                        <a th:if="${item.product.status.name() == 'ACTIVE'}"
                           th:href="@{/products/{slug}(slug=${item.product.slug})}" class="btn btn-primary">Xem sản phẩm</a>
                        <form th:action="@{/customer/wishlist/remove/{id}(id=${item.product.id})}" method="post"
                              onsubmit="return confirm('Bạn có muốn gỡ sản phẩm này khỏi danh sách yêu thích?');">
                            <button class="btn btn-outline-danger" type="submit">Gỡ khỏi yêu thích</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
