<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main-layout}">
<head><title>Đánh giá của tôi</title></head><body>
<div layout:fragment="content" class="container py-4 py-lg-5">
    <div class="feedback-history mx-auto">
        <header class="feedback-page-heading"><div><span class="feedback-eyebrow">Trải nghiệm mua hàng</span><h1 class="h3 mb-2">Đánh giá của tôi</h1><p class="text-muted mb-0">Xem lại đánh giá bạn đã gửi và phản hồi từ PetShop.</p></div><a th:href="@{/customer/orders}" class="btn btn-outline-primary"><i class="bi bi-bag-check me-2" aria-hidden="true"></i>Đơn hàng của tôi</a></header>
        <p th:unless="${reviews.empty}" class="feedback-meta mb-3" th:text="${reviews.totalElements + ' đánh giá đã gửi'}"></p>
        <div th:if="${reviews.empty}" class="card feedback-empty"><i class="bi bi-chat-square-heart" aria-hidden="true"></i><h2 class="h5 mt-3">Bạn chưa gửi đánh giá nào</h2><p class="text-muted">Bạn có thể đánh giá từng sản phẩm trong đơn đã hoàn tất và thanh toán.</p><a th:href="@{/customer/orders}" class="btn btn-primary">Xem đơn hàng của tôi</a></div>
        <article th:each="r : ${reviews.content}" class="card feedback-card mb-3">
            <div th:replace="~{fragments/feedback :: purchase(${r.orderItem},${reviewImages[r.orderItem.id]})}"></div>
            <div class="feedback-review-heading"><div th:replace="~{fragments/feedback :: rating(${r.rating})}"></div><span class="feedback-meta" th:text="${#temporals.format(r.createdAt,'dd/MM/yyyy HH:mm')}"></span></div>
            <p class="feedback-comment" th:text="${r.comment}"></p>
            <span class="feedback-status" th:classappend="${r.status.name() == 'VISIBLE' ? 'feedback-status-visible' : 'feedback-status-hidden'}"><i class="bi" th:classappend="${r.status.name() == 'VISIBLE' ? 'bi-eye' : 'bi-eye-slash'}" aria-hidden="true"></i><span th:text="${r.status.name() == 'VISIBLE' ? 'Đang hiển thị trên trang sản phẩm' : 'Đã ẩn khỏi trang sản phẩm'}"></span></span>
            <div th:replace="~{fragments/feedback :: reply(${r},false)}"></div>
        </article>
        <nav th:if="${reviews.totalPages > 1}" class="feedback-pagination" aria-label="Trang đánh giá của tôi">
            <a th:if="${reviews.hasPrevious()}" class="btn btn-outline-secondary btn-sm" th:href="@{/customer/reviews(page=${reviews.number - 1})}"><i class="bi bi-chevron-left me-1" aria-hidden="true"></i>Trước</a>
            <span class="feedback-meta" th:text="${'Trang ' + (reviews.number + 1) + ' / ' + reviews.totalPages}"></span>
            <a th:if="${reviews.hasNext()}" class="btn btn-outline-secondary btn-sm" th:href="@{/customer/reviews(page=${reviews.number + 1})}">Sau<i class="bi bi-chevron-right ms-1" aria-hidden="true"></i></a>
        </nav>
    </div>
</div></body></html>
